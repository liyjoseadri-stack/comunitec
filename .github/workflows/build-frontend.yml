
name: Compilar frontend Común&Tec

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Vite
        run: npm run build

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: comunitec-frontend
          path: public/build/
          if-no-files-found: error
          retention-days: 7
